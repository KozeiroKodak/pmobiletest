<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Paridade CSS Dados locais</title>
<link rel="stylesheet" href="../../style.css">
<link rel="stylesheet" href="../../implementacoes/reservas.css">
<link rel="stylesheet" href="../../implementacoes/pesquisa.css">
<link rel="stylesheet" href="../../implementacoes/contagemmanual.css">
<link rel="stylesheet" href="../../implementacoes/locais.css">
<link rel="stylesheet" href="../../implementacoes/conferenciasrealizadas.css">
<link rel="stylesheet" href="../../implementacoes/importacao.css">
<link rel="stylesheet" href="../../monochrome.css">
<link rel="stylesheet" href="../../cyan-theme.css">
<link rel="stylesheet" href="../../implementacoes/configuracoes.css">
<link rel="stylesheet" href="../../implementacoes/dados-locais.css">
<style>body{margin:0}.qa{padding:10px}</style></head>
<body>
<section id="pesquisa" class="qa"><div class="painel pesquisa">
  <div class="pesquisa-tipos"><button class="ativo">Código</button></div>
  <button class="pesquisa-buscar">Pesquisar material</button>
  <details class="pesquisa-card"><summary><span class="pesquisa-disponivel">Disponível</span>Exemplo</summary></details>
</div></section>
<section id="contagemManual" class="qa"><div class="cabecalho-pagina"><h1>Contagem manual</h1></div><div class="painel contagem">
  <button class="botao-aba contagem-salvar">Salvar contagem</button>
  <div class="contagem-campo"><span>⌕</span><input placeholder="Código"></div><div class="contagem-tipos"><button class="ativo">Código</button></div>
</div><div class="painel contagem contagem-lista">Contagens registradas</div></section>
<section id="locais" class="qa"><div class="painel painel-locais">
  <details class="local-alterado-card locais-cartao"><summary class="locais-resumo-cartao">Local</summary></details>
</div></section>
<section id="configuracoes" class="qa"><div class="configuracoes-grade"><button class="configuracoes-card">Configurações</button></div></section>
<section class="qa"><div id="resultadoConferencias">
  <details class="registro-conferencia"><summary>Conferência</summary></details>
</div></section>
<section id="reservas" class="qa"><div class="painel painel-reservas"><article class="reserva-item"><div class="reserva-celula reserva-id" data-label="ID">1</div></article></div></section>
<section id="importacao" class="qa"><div class="painel"><div class="acoes-importacao"><button class="botao-aba botao-importar-materiais">Importar planilha</button></div></div></section>
<section id="dadosLocais" class="qa"><div class="dl-app">
 <div class="painel pesquisa">
  <div class="pesquisa-tipos"><button class="ativo">Código</button></div>
  <button class="pesquisa-buscar">Pesquisar material</button>
  <details class="pesquisa-card"><summary><span class="pesquisa-disponivel">Disponível</span>Exemplo</summary></details>
 </div>
 <section data-dl-panel="estoque"><div class="dl-retorno"></div><div class="painel contagem">
  <button class="botao-aba contagem-salvar">Salvar contagem</button>
  <div class="contagem-campo"><span>⌕</span><input placeholder="Código"></div><div class="contagem-tipos"><button class="ativo">Código</button></div>
 </div></section>
 <div class="painel painel-locais">
  <details class="local-alterado-card locais-cartao"><summary class="locais-resumo-cartao">Local</summary></details>
 </div>
 <div class="configuracoes-grade"><button class="configuracoes-card">Configurações</button></div>
 <div id="dlHistorico"><details class="registro-conferencia"><summary>Conferência</summary></details></div>
 <section data-dl-panel="reservas"><div class="painel painel-reservas"><article class="reserva-item"><div class="reserva-celula reserva-id" data-label="ID">1</div></article></div></section>
 <section data-dl-panel="importar"><div class="painel"><div class="acoes-importacao"><button class="botao-aba botao-importar-materiais">Importar planilha</button></div></div></section>
</div></section>
<pre id="qa-status" data-qa-fail="pending">aguardando DOM</pre>
<script>
(function(){
 const items=[
 ["Pesquisa — painel","#pesquisa .pesquisa","#dadosLocais .pesquisa",["backgroundColor","borderRadius","paddingTop"]],
 ["Pesquisa — botão","#pesquisa .pesquisa-buscar","#dadosLocais .pesquisa-buscar",["backgroundColor","borderRadius","minHeight"]],
 ["Pesquisa — seleção","#pesquisa .pesquisa-tipos button.ativo","#dadosLocais .pesquisa-tipos button.ativo",["backgroundColor","borderRadius","color"]],
 ["Pesquisa — resultado","#pesquisa .pesquisa-card","#dadosLocais .pesquisa-card",["backgroundColor","borderRadius","borderTopColor"]],
 ["Contagem — painel","#contagemManual .contagem","#dadosLocais .contagem",["backgroundColor","borderRadius","paddingTop"]],
 ["Contagem — botão","#contagemManual .contagem-salvar","#dadosLocais .contagem-salvar",["backgroundColor","borderRadius","color"]],
 ["Contagem — campo","#contagemManual .contagem-campo","#dadosLocais .contagem-campo",["backgroundColor","borderRadius"]],
 ["Locais — painel","#locais .painel-locais","#dadosLocais .painel-locais",["backgroundColor","borderRadius"]],
 ["Locais — cartão","#locais .locais-cartao","#dadosLocais .locais-cartao",["backgroundColor","borderRadius","paddingTop"]],
 ["Configurações — cartão","#configuracoes .configuracoes-card","#dadosLocais .configuracoes-card",["backgroundColor","borderRadius","minHeight"]],
 ["Conferências — cartão","#resultadoConferencias .registro-conferencia","#dadosLocais #dlHistorico .registro-conferencia",["backgroundColor","borderRadius"]],
 ["Contagem — botão ativo","#contagemManual .contagem-tipos button.ativo","#dadosLocais .contagem-tipos button.ativo",["backgroundColor","color","borderColor","borderRadius"]],
 ["Pesquisa — marcador","#pesquisa .pesquisa-disponivel","#dadosLocais .pesquisa-disponivel",["float","display","color"]],
 ["Configurações — grade","#configuracoes .configuracoes-grade","#dadosLocais .configuracoes-grade",["display","gridTemplateColumns","columnGap"]],
 ["Reservas — painel","#reservas .painel-reservas","#dadosLocais .painel-reservas",["backgroundColor","paddingTop","borderRadius"]],
 ["Reservas — item","#reservas .reserva-item","#dadosLocais .reserva-item",["backgroundColor","gridTemplateColumns","paddingTop"]],
 ["Importação — botão","#importacao .botao-importar-materiais","#dadosLocais .botao-importar-materiais",["backgroundColor","color","borderRadius","minHeight"]]
 ];
 let fails=0;
 const lines=items.map(([titulo,a,b,props])=>{
   const left=document.querySelector(a),right=document.querySelector(b);
   if(!left||!right){fails++;return "FALHOU "+titulo+" elemento não encontrado";}
   const x=getComputedStyle(left),y=getComputedStyle(right);
   const diffs=props.filter(p=>x[p]!==y[p]).map(p=>p+": nativo "+x[p]+" / local "+y[p]);
   if(diffs.length)fails++;
   return (diffs.length?"FALHOU ":"OK ")+titulo+(diffs.length?" "+diffs.join("; "):"");
 });
 const result=document.getElementById("qa-status");
 result.setAttribute("data-qa-fail",String(fails));
 result.textContent=lines.join("\n");
})();
</script>
</body></html>
