name: Deploy PMOBILE Pages

on:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'style.css'
      - '*.js'
      - 'implementacoes/**'
      - 'ota/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pmobile-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare Pages artifact
        shell: bash
        run: |
          set -euo pipefail

          rm -rf _site
          mkdir -p _site

          while IFS= read -r -d '' file; do
            case "$file" in
              www/*|android/*|.github/*|build/*|node_modules/*|gradle/*|gradlew|gradlew.bat|package.json|package-lock.json)
                continue
                ;;
            esac

            mkdir -p "_site/$(dirname "$file")"
            cp "$file" "_site/$file"
          done < <(git ls-files -z)

          test -f _site/index.html
          test -f _site/ota/manifest.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
