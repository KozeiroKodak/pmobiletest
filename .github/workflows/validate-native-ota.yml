name: Validar script OTA APK PMobile

on:
  push:
    branches: [main]
    paths:
      - 'scripts/publicar-ota-apk-termux.sh'
      - 'tests/native-ota-publish.test.cjs'
      - '.github/workflows/validate-native-ota.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validar sintaxe Bash
        run: bash -n scripts/publicar-ota-apk-termux.sh
      - name: Executar testes da publicacao OTA APK
        run: node --test tests/native-ota-publish.test.cjs
