name: Publish PMOBILE OTA

on:
  push:
    branches:
      - main
    paths:
      - '*.html'
      - '*.css'
      - '*.js'

permissions:
  contents: write

concurrency:
  group: pmobile-ota-publish
  cancel-in-progress: false

jobs:
  publish-ota:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate next OTA version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          current_version="$(python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = Path("ota/manifest.json")
          if not manifest.exists():
              print("0.0.0")
          else:
              data = json.loads(manifest.read_text())
              print(data.get("webVersion", "0.0.0"))
          PY
          )"

          IFS='.' read -r major minor patch <<< "$current_version"
          next_patch=$((patch + 1))
          next_version="${major}.${minor}.${next_patch}"

          echo "current=$current_version"
          echo "next=$next_version"

          echo "current=$current_version" >> "$GITHUB_OUTPUT"
          echo "next=$next_version" >> "$GITHUB_OUTPUT"

      - name: Prepare OTA package
        env:
          VERSION: ${{ steps.version.outputs.next }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build/ota

          find . -maxdepth 1 -type f \
            \( -name '*.html' -o -name '*.css' -o -name '*.js' \) \
            -exec cp {} build/ota/ \;

          cd build/ota
          zip -qr "../../pmobile-web-${VERSION}.zip" .

      - name: Calculate SHA-256
        id: sha
        env:
          VERSION: ${{ steps.version.outputs.next }}
        shell: bash
        run: |
          set -euo pipefail

          sha256="$(sha256sum "pmobile-web-${VERSION}.zip" | awk '{print $1}')"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "SHA-256: $sha256"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.next }}
        shell: bash
        run: |
          set -euo pipefail

          gh release create \
            "ota-web-${VERSION}" \
            "pmobile-web-${VERSION}.zip" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "OTA Web ${VERSION}" \
            --notes "Automated PMOBILE web OTA release."

      - name: Update OTA manifest
        env:
          VERSION: ${{ steps.version.outputs.next }}
          SHA256: ${{ steps.sha.outputs.sha256 }}
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          version = os.environ["VERSION"]
          sha256 = os.environ["SHA256"]

          manifest = {
              "webVersion": version,
              "nativeMinVersion": "1.0",
              "package": (
                  f"https://github.com/{os.environ['GITHUB_REPOSITORY']}"
                  f"/releases/download/ota-web-{version}/"
                  f"pmobile-web-{version}.zip"
              ),
              "sha256": sha256,
              "mandatory": False
          }

          path = Path("ota/manifest.json")
          path.write_text(
              json.dumps(manifest, indent=2, ensure_ascii=False) + "\n"
          )
          PY

      - name: Commit updated manifest
        env:
          VERSION: ${{ steps.version.outputs.next }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add ota/manifest.json
          git commit -m "ota: publica web ${VERSION}"
          git push origin main
