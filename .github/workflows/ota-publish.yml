name: Publish PMOBILE OTA

on:
  push:
    branches:
      - main
    paths:
      - "*.html"
      - "*.css"
      - "*.js"
      - "implementacoes/**"
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      motivo:
        description: 'Motivo da publicação manual'
        required: false
        default: 'publicação manual'

permissions:
  contents: write

concurrency:
  group: pmobile-ota-publish
  cancel-in-progress: false

jobs:
  ota-gate:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.gate.outputs.publish }}
    steps:
      - name: Verificar se existe OTA pendente
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_ACTOR}" == "github-actions[bot]" ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Execução originada pelo próprio pipeline: sem nova OTA."
            exit 0
          fi

          current_main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"

          if [[ "${current_main}" != "${GITHUB_SHA}" ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Execução obsoleta: main já avançou."
            echo "SHA da execução: ${GITHUB_SHA}"
            echo "SHA atual da main: ${current_main}"
            exit 0
          fi

          if [[ "${GITHUB_EVENT_NAME}" != "schedule" ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Evento ${GITHUB_EVENT_NAME}: publicação autorizada."
            exit 0
          fi

          latest_target="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=1" --jq '.[0].target_commitish // empty')"

          echo "HEAD avaliado pela execução: ${GITHUB_SHA}"
          echo "Último release OTA aponta para: ${latest_target:-<nenhum>}"

          if [[ -z "${latest_target}" || "${latest_target}" != "${GITHUB_SHA}" ]]; then
            echo "OTA pendente: publicação autorizada."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "Main já está publicada no último OTA."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

  publish-ota:
    needs: ota-gate
    if: needs.ota-gate.outputs.publish == 'true' && (github.event_name == 'workflow_dispatch' || github.actor != 'github-actions[bot]')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preflight web layer
        shell: bash
        run: |
          set -euo pipefail

          echo "== PMOBILE OTA PREFLIGHT V2 =="

          test -f index.html
          test -f style.css
          test -f script.js
          grep -qF 'window.PMOBILE_OK = true;' script.js

          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("ota/manifest.json").read_text())
          version = data.get("webVersion")

          if not isinstance(version, str):
              raise SystemExit("webVersion inválido no manifest.")

          parts = version.split(".")
          if len(parts) != 3 or not all(p.isdigit() for p in parts):
              raise SystemExit(f"Versão inválida: {version}")

          print(f"Manifest JSON: OK ({version})")
          PY

          # O OTA V2 valida somente o conjunto que realmente pode ser enviado.
          # /www é deliberadamente excluído: é conteúdo nativo/fallback do APK,
          # nunca uma fonte de sincronização OTA.
          mapfile -d '' js_files < <(
            git ls-files -z -- '*.js'               ':!www/*'               ':!android/*'               ':!node_modules/*'               ':!.git/*'               ':!build/*'
          )

          if (( ${#js_files[@]} == 0 )); then
            echo "Nenhum JS do web layer encontrado."
            exit 1
          fi

          for file in "${js_files[@]}"; do
            echo "Validando JS OTA: $file"
            node --check "$file"
          done

          echo "Sintaxe JavaScript do web layer: OK"

          if [[ -f rastreioimportacao.js ]]; then
            python3 - <<'PY'
          from pathlib import Path

          source = Path("rastreioimportacao.js").read_text()

          forbidden = (
              "deslocamentoLinha is not defined",
              "linha_origem: (indice + deslocamentoLinha)",
              '"Linha " + (indice + deslocamentoLinha)',
          )

          for pattern in forbidden:
              if pattern in source:
                  raise SystemExit(f"Smoke test reprovado: {pattern}")

          print("Smoke test rastreioimportacao.js: OK")
          PY
          fi

          python3 - <<'PY'
          import re
          from pathlib import Path

          html = Path("index.html").read_text()
          refs = re.findall(
              r'''(?:src|href)=["']((?!https?://|//)[^"']+\.(?:js|css)(?:\?v=[^"']*)?)["']''',
              html,
          )

          if not refs:
              raise SystemExit("Nenhum asset local JS/CSS encontrado no index.html.")

          missing = []
          forbidden_www = []

          for ref in refs:
              local = ref.split("?", 1)[0].split("#", 1)[0]
              if local.startswith("www/"):
                  forbidden_www.append(local)
              elif not Path(local).is_file():
                  missing.append(local)

          if forbidden_www:
              raise SystemExit(
                  "index.html referencia assets em /www, que é proibido no OTA: "
                  + ", ".join(forbidden_www)
              )

          if missing:
              print("Assets locais ausentes:")
              for item in missing:
                  print(f" - {item}")
              raise SystemExit("Preflight reprovado: asset local ausente.")

          print(f"Assets locais referenciados: {len(refs)} — todos encontrados.")
          PY

          echo "== PREFLIGHT V2 APROVADO =="

      - name: Calculate next OTA version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          release_versions="$(gh api --paginate             "repos/${GITHUB_REPOSITORY}/releases?per_page=100"             --jq '.[].tag_name' |
            sed -n 's/^ota-web-\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)$/\1/p')"

          manifest_version="$(python3 - <<'PY'
          import json
          from pathlib import Path

          try:
              print(json.loads(Path("ota/manifest.json").read_text()).get("webVersion", "0.0.0"))
          except Exception:
              print("0.0.0")
          PY
          )"

          current_version="$(printf '%s\n%s\n' "$release_versions" "$manifest_version" |
            python3 -c '
          import sys, re
          versions = []
          for line in sys.stdin:
              line = line.strip()
              if re.fullmatch(r"\d+\.\d+\.\d+", line):
                  versions.append(tuple(map(int, line.split("."))))
          print(".".join(map(str, max(versions))) if versions else "0.0.0")
          ')"

          IFS='.' read -r major minor patch <<< "$current_version"
          next_version="${major}.${minor}.$((patch + 1))"

          echo "Versão atual: $current_version"
          echo "Próxima OTA: $next_version"
          echo "next=$next_version" >> "$GITHUB_OUTPUT"

      - name: Apply automatic cache busting
        env:
          VERSION: ${{ steps.version.outputs.next }}
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$VERSION" python3 - <<'PY'
          import os, re
          from pathlib import Path

          version = os.environ["VERSION"]
          path = Path("index.html")
          html = path.read_text()

          pattern = re.compile(
              r'''(?P<prefix>(?:src|href)=["'])'''
              r'''(?P<file>(?!https?://|//)[^"']+\.(?:js|css))'''
              r'''(?:\?v=[^"']*)?'''
              r'''(?P<suffix>["'])'''
          )

          html, count = pattern.subn(
              lambda m: (
                  f'{m.group("prefix")}{m.group("file")}'
                  f'?v={version}{m.group("suffix")}'
              ),
              html,
          )

          if count == 0:
              raise SystemExit("Nenhum asset local JS/CSS encontrado para cache busting.")

          path.write_text(html)
          print(f"Cache busting aplicado em {count} assets: v={version}")
          PY

      - name: Revalidate generated index
        env:
          VERSION: ${{ steps.version.outputs.next }}
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import re
          from pathlib import Path

          html = Path("index.html").read_text()
          assets = re.findall(
              r'''(?:src|href)=["']((?!https?://|//)[^"']+\.(?:js|css)\?v=[^"']+)["']''',
              html,
          )

          if not assets:
              raise SystemExit("Nenhum asset versionado encontrado após cache busting.")

          print(f"Cache busting validado em {len(assets)} assets.")
          PY

      - name: Prepare OTA package
        env:
          VERSION: ${{ steps.version.outputs.next }}
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build/ota "pmobile-web-${VERSION}.zip"
          mkdir -p build/ota

          # Empacota somente extensões e diretórios explicitamente pertencentes
          # ao web layer. Não basta excluir /www: SQL, scripts de teste e outros
          # arquivos auxiliares também não devem entrar no OTA.
          while IFS= read -r -d '' file; do
            case "$file" in
              *.html|*.css|*.js)
                ;;
              *)
                continue
                ;;
            esac

            case "$file" in
              www/*|android/*|.github/*|ota/*|build/*|node_modules/*|gradle/*)
                continue
                ;;
            esac

            mkdir -p "build/ota/$(dirname "$file")"
            cp "$file" "build/ota/$file"
          done < <(git ls-files -z)

          if [[ ! -f build/ota/index.html || ! -f build/ota/script.js ]]; then
            echo "ERRO: pacote OTA não contém os arquivos web essenciais."
            exit 1
          fi

          if [[ -e build/ota/www ]]; then
            echo "ERRO: /www entrou no pacote OTA."
            exit 1
          fi

          cd build/ota
          zip -qr "../../pmobile-web-${VERSION}.zip" .
          cd ../..

          test -s "pmobile-web-${VERSION}.zip"
          unzip -t "pmobile-web-${VERSION}.zip" >/dev/null

          if unzip -Z1 "pmobile-web-${VERSION}.zip" | grep -q '^www/'; then
            echo "ERRO: pacote OTA contém /www."
            exit 1
          fi

          echo "Pacote OTA V2: OK"
          echo "Tamanho: $(du -h "pmobile-web-${VERSION}.zip" | awk '{print $1}')"

      - name: Calculate SHA-256
        id: sha
        env:
          VERSION: ${{ steps.version.outputs.next }}
        shell: bash
        run: |
          set -euo pipefail

          sha256="$(sha256sum "pmobile-web-${VERSION}.zip" | awk '{print $1}')"
          test "${#sha256}" -eq 64

          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "SHA-256: $sha256"

      - name: Verify main did not advance
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main --quiet
          current_main="$(git rev-parse origin/main)"

          if [[ "$current_main" != "${GITHUB_SHA}" ]]; then
            echo "A main avançou durante a preparação da OTA."
            echo "Esperado: ${GITHUB_SHA}"
            echo "Atual:    $current_main"
            echo "Abortando publicação para evitar OTA baseada em commit obsoleto."
            exit 1
          fi

          echo "Main permanece estável: $current_main"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.next }}
          ZIP: pmobile-web-${{ steps.version.outputs.next }}.zip
        shell: bash
        run: |
          set -euo pipefail

          tag="ota-web-${VERSION}"

          if gh release view "$tag" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release $tag já existe. Publicação duplicada bloqueada."
            exit 1
          fi

          gh release create             "$tag"             "$ZIP"             --repo "${GITHUB_REPOSITORY}"             --target "${GITHUB_SHA}"             --title "OTA Web ${VERSION}"             --notes "Automated PMOBILE web OTA release V2."

          echo "release_created=true" >> "$GITHUB_ENV"
          echo "Release $tag criado."

      - name: Update OTA manifest
        env:
          VERSION: ${{ steps.version.outputs.next }}
          SHA256: ${{ steps.sha.outputs.sha256 }}
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json, os
          from pathlib import Path

          version = os.environ["VERSION"]
          sha256 = os.environ["SHA256"]
          repo = os.environ["GITHUB_REPOSITORY"]

          manifest = {
              "webVersion": version,
              "nativeMinVersion": "1.0",
              "package": (
                  f"https://github.com/{repo}/releases/download/"
                  f"ota-web-{version}/pmobile-web-{version}.zip"
              ),
              "sha256": sha256,
              "mandatory": False,
          }

          path = Path("ota/manifest.json")
          path.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + "\n")
          json.loads(path.read_text())
          print(path.read_text())
          PY

      - name: Publish manifest atomically
        env:
          VERSION: ${{ steps.version.outputs.next }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add ota/manifest.json index.html

          if git diff --cached --quiet; then
            echo "Nenhuma alteração gerada para publicar."
            exit 1
          fi

          git commit -m "ota: publica web ${VERSION}"

          git fetch origin main --quiet
          current_main="$(git rev-parse origin/main)"

          if [[ "$current_main" != "${GITHUB_SHA}" ]]; then
            echo "Main avançou antes do push final; abortando."
            exit 1
          fi

          if git push origin HEAD:main; then
            echo "Manifest OTA ${VERSION} publicado com sucesso."
            exit 0
          fi

          echo "Push final falhou; a publicação será considerada incompleta."
          exit 1

      - name: Finalize publication
        if: success()
        env:
          VERSION: ${{ steps.version.outputs.next }}
        shell: bash
        run: |
          set -euo pipefail
          echo "OTA ${VERSION} publicada com sucesso."

      - name: Cleanup orphan release
        if: failure() && env.release_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.next }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Limpando Release órfão ota-web-${VERSION}..."

          gh release delete             "ota-web-${VERSION}"             --repo "${GITHUB_REPOSITORY}"             --cleanup-tag             --yes || true
