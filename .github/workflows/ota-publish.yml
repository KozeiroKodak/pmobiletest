name: Publish PMOBILE OTA

on:
  push:
    branches:
      - main
    paths:
      - '**/*.html'
      - '**/*.css'
      - '**/*.js'
      - '**/*.json'
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.jpeg'
      - '**/*.webp'
      - '**/*.svg'
      - '**/*.ico'
      - '**/*.woff'
      - '**/*.woff2'
      - '**/*.ttf'
      - '**/*.otf'
      - '.github/workflows/ota-publish.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pmobile-ota-publish
  cancel-in-progress: false

jobs:
  publish-ota:
    # O commit gerado pelo próprio workflow altera index.html/manifest.
    # Ele não deve disparar uma nova publicação OTA.
    if: github.actor != 'github-actions[bot]' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preflight web layer
        shell: bash
        run: |
          set -euo pipefail

          echo "== PMOBILE OTA PREFLIGHT =="

          test -f index.html
          test -f style.css
          test -f script.js

          grep -qF 'window.PMOBILE_OK = true;' script.js

          echo "Arquivos essenciais: OK"
          echo "PMOBILE_OK: OK"

          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("ota/manifest.json")
          data = json.loads(path.read_text())

          version = data.get("webVersion")
          if not isinstance(version, str):
              raise SystemExit("webVersion inválido no manifest.")

          parts = version.split(".")
          if len(parts) != 3 or not all(p.isdigit() for p in parts):
              raise SystemExit(f"Versão inválida: {version}")

          print(f"Manifest JSON: OK ({version})")
          PY

          mapfile -d '' js_files < <(
            find . -type f -name '*.js' \
              ! -path './.git/*' \
              ! -path './node_modules/*' \
              ! -path './build/*' \
              -print0
          )

          if (( ${#js_files[@]} == 0 )); then
            echo "Nenhum arquivo JS encontrado."
            exit 1
          fi

          for file in "${js_files[@]}"; do
            file="${file#./}"
            echo "Validando JS: $file"
            node --check "$file"
          done

          echo "Sintaxe JavaScript recursiva: OK"

          python3 - <<'PY'
          import re
          from pathlib import Path

          html = Path("index.html").read_text()
          refs = re.findall(
              r'''(?:src|href)=["']((?!https?://|//)[^"']+\.(?:js|css)(?:\?v=[^"']*)?)["']''',
              html,
          )

          if not refs:
              raise SystemExit("Nenhum asset local JS/CSS foi encontrado no index.html.")

          missing = []
          for ref in refs:
              local = ref.split("?", 1)[0].split("#", 1)[0]
              if not Path(local).is_file():
                  missing.append(local)

          if missing:
              print("Assets locais ausentes:")
              for item in missing:
                  print(f" - {item}")
              raise SystemExit("Preflight reprovado: asset local referenciado não existe.")

          print(f"Assets locais referenciados: {len(refs)} — todos encontrados.")
          PY

          echo "== PREFLIGHT APROVADO =="

      - name: Calculate next OTA version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          release_versions="$(
            gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq '.[].tag_name' |
              sed -n 's/^ota-web-\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)$/\1/p'
          )"

          manifest_version="$(
            python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("ota/manifest.json")
          if not path.exists():
              print("0.0.0")
          else:
              try:
                  data = json.loads(path.read_text())
                  print(data.get("webVersion", "0.0.0"))
              except Exception:
                  print("0.0.0")
          PY
          )"

          current_version="$(
            printf '%s\n%s\n' "$release_versions" "$manifest_version" |
            python3 -c '
          import sys
          import re

          versions = []

          for line in sys.stdin:
              line = line.strip()
              if re.fullmatch(r"\d+\.\d+\.\d+", line):
                  versions.append(tuple(map(int, line.split("."))))

          if not versions:
              print("0.0.0")
          else:
              print(".".join(map(str, max(versions))))
          '
          )"

          IFS='.' read -r major minor patch <<< "$current_version"
          next_patch=$((patch + 1))
          next_version="${major}.${minor}.${next_patch}"

          echo "Versão atual: $current_version"
          echo "Próxima OTA: $next_version"

          echo "current=$current_version" >> "$GITHUB_OUTPUT"
          echo "next=$next_version" >> "$GITHUB_OUTPUT"

      - name: Apply automatic cache busting
        env:
          VERSION: ${{ steps.version.outputs.next }}
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ["VERSION"]
          path = Path("index.html")
          html = path.read_text()

          # Versiona somente assets locais do PMOBILE. URLs externas ficam intactas.
          pattern = re.compile(
              r'''(?P<prefix>(?:src|href)=["'])'''
              r'''(?P<file>(?!https?://)[^"']+\.(?:js|css))'''
              r'''(?:\?v=[^"']*)?'''
              r'''(?P<suffix>["'])'''
          )
          html, count = pattern.subn(
              lambda m: (
                  f'{m.group("prefix")}{m.group("file")}'
                  f'?v={version}{m.group("suffix")}'
              ),
              html,
          )

          if count == 0:
              raise SystemExit("Nenhum asset local JS/CSS encontrado para versionar.")

          path.write_text(html)
          print(f"Cache busting aplicado em {count} assets locais com v={version}")
          PY

          python3 - <<'PY'
          import re
          from pathlib import Path

          html = Path("index.html").read_text()
          assets = re.findall(
              r'''(?:src|href)=["']((?!https?://)[^"']+\.(?:js|css)\?v=[^"']+)["']''',
              html,
          )

          if not assets:
              raise SystemExit("Cache busting não encontrado no index.html.")

          print("Assets versionados:")
          for asset in assets:
              print(f" - {asset}")
          PY

      - name: Prepare OTA package
        env:
          VERSION: ${{ steps.version.outputs.next }}
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build/ota
          mkdir -p build/ota

          find . -type f \
            ! -path './.git/*' \
            ! -path './.github/*' \
            ! -path './ota/*' \
            ! -path './build/*' \
            ! -path './android/*' \
            ! -path './node_modules/*' \
            ! -path './gradle/*' \
            ! -path './gradlew' \
            ! -path './gradlew.bat' \
            ! -name 'package-lock.json' \
            ! -name 'package.json' \
            -exec sh -c 'mkdir -p "build/ota/$(dirname "$1")" && cp "$1" "build/ota/$1"' _ {} \;

          cd build/ota
          zip -qr "../../pmobile-web-${VERSION}.zip" .

          cd ../..

          test -s "pmobile-web-${VERSION}.zip"
          unzip -t "pmobile-web-${VERSION}.zip" >/dev/null

          echo "Pacote OTA: OK"
          echo "Tamanho: $(du -h "pmobile-web-${VERSION}.zip" | awk '{print $1}')"

      - name: Calculate SHA-256
        id: sha
        env:
          VERSION: ${{ steps.version.outputs.next }}
        shell: bash
        run: |
          set -euo pipefail

          sha256="$(sha256sum "pmobile-web-${VERSION}.zip" | awk '{print $1}')"

          test "${#sha256}" -eq 64

          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "SHA-256: $sha256"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.next }}
          ZIP: pmobile-web-${{ steps.version.outputs.next }}.zip
        shell: bash
        run: |
          set -euo pipefail

          gh release create \
            "ota-web-${VERSION}" \
            "$ZIP" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "OTA Web ${VERSION}" \
            --notes "Automated PMOBILE web OTA release."

          echo "release_created=true" >> "$GITHUB_ENV"

      - name: Update OTA manifest
        env:
          VERSION: ${{ steps.version.outputs.next }}
          SHA256: ${{ steps.sha.outputs.sha256 }}
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          version = os.environ["VERSION"]
          sha256 = os.environ["SHA256"]

          manifest = {
              "webVersion": version,
              "nativeMinVersion": "1.0",
              "package": (
                  f"https://github.com/{os.environ['GITHUB_REPOSITORY']}"
                  f"/releases/download/ota-web-{version}/"
                  f"pmobile-web-{version}.zip"
              ),
              "sha256": sha256,
              "mandatory": False
          }

          path = Path("ota/manifest.json")
          path.write_text(
              json.dumps(manifest, indent=2, ensure_ascii=False) + "\n"
          )
          PY

          python3 -m json.tool ota/manifest.json >/dev/null

          echo "Manifest atualizado:"
          cat ota/manifest.json

      - name: Commit updated manifest
        env:
          VERSION: ${{ steps.version.outputs.next }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.html ota/manifest.json

          if git diff --cached --quiet; then
            echo "Nenhuma alteração no manifest."
            exit 1
          fi

          git commit -m "ota: publica web ${VERSION}"

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Manifest publicado com sucesso."
              exit 0
            fi

            if (( attempt == 3 )); then
              break
            fi

            echo "Push falhou por avanço concorrente da main. Rebaseando e reaplicando os arquivos gerados (tentativa ${attempt}/3)..."

            git rebase --abort >/dev/null 2>&1 || true
            git fetch origin main

            # Não fazemos rebase cego do commit automático: index.html pode ter
            # recebido novas alterações enquanto a OTA era preparada. Voltamos
            # ao estado atual da main e reaplicamos somente o cache busting e o
            # manifest desta versão, preservando o código mais recente.
            git reset --hard origin/main

            VERSION="${VERSION}" python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ["VERSION"]
          path = Path("index.html")
          html = path.read_text()

          pattern = re.compile(
              r'''(?P<prefix>(?:src|href)=["'])'''
              r'''(?P<file>(?!https?://)[^"']+\.(?:js|css))'''
              r'''(?:\?v=[^"']*)?'''
              r'''(?P<suffix>["'])'''
          )

          html, count = pattern.subn(
              lambda m: (
                  f'{m.group("prefix")}{m.group("file")}'
                  f'?v={version}{m.group("suffix")}'
              ),
              html,
          )

          if count == 0:
              raise SystemExit("Nenhum asset local JS/CSS encontrado após sincronização.")

          path.write_text(html)
          print(f"Cache busting reaplicado com v={version} em {count} assets.")
          PY

            VERSION="${VERSION}" SHA256="${{ steps.sha.outputs.sha256 }}" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          version = os.environ["VERSION"]
          sha256 = os.environ["SHA256"]

          manifest = {
              "webVersion": version,
              "nativeMinVersion": "1.0",
              "package": (
                  f"https://github.com/{os.environ['GITHUB_REPOSITORY']}"
                  f"/releases/download/ota-web-{version}/"
                  f"pmobile-web-{version}.zip"
              ),
              "sha256": sha256,
              "mandatory": False
          }

          Path("ota/manifest.json").write_text(
              json.dumps(manifest, indent=2, ensure_ascii=False) + "\n"
          )
          PY

            git add index.html ota/manifest.json
            git commit -m "ota: publica web ${VERSION} (retry)"

          done

          echo "Não foi possível publicar o manifest após 3 tentativas."
          exit 1

      - name: Finalize publication
        if: success()
        env:
          VERSION: ${{ steps.version.outputs.next }}
        shell: bash
        run: |
          set -euo pipefail
          echo "OTA ${VERSION} publicado com sucesso."

      - name: Cleanup orphan release
        if: failure() && env.release_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.next }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Limpando Release órfão ota-web-${VERSION}..."

          gh release delete \
            "ota-web-${VERSION}" \
            --repo "${GITHUB_REPOSITORY}" \
            --cleanup-tag \
            --yes || true
