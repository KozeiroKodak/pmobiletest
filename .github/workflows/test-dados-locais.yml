name: Validar Dados locais do PMobile
on:
  push:
    branches: [main]
    paths:
      - 'dados-locais.js'
      - 'www/dados-locais.js'
      - 'tests/dados-locais-importacao.test.cjs'
      - 'tests/dados-locais-visual.test.cjs'
      - 'tests/fixtures/dados-locais-paridade.html'
      - '.github/workflows/test-dados-locais.yml'
  pull_request:
    paths:
      - 'dados-locais.js'
      - 'reorganizacao-pmobile.js'
      - 'index.html'
      - 'script.js'
      - 'implementacoes/dados-locais.css'
      - 'www/**'
      - 'sql/pmobile_dados_locais_isolados.sql'
      - 'tests/dados-locais.test.cjs'
      - 'tests/dados-locais-visual.test.cjs'
      - 'tests/fixtures/dados-locais-paridade.html'
      - '.github/workflows/test-dados-locais.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Conferir sintaxe e isolamento das fontes
        run: |
          node --check dados-locais.js
          node --check reorganizacao-pmobile.js
          node --check script.js
          node --test tests/dados-locais.test.cjs tests/dados-locais-importacao.test.cjs tests/dados-locais-visual.test.cjs
      - name: Conferir paridade de estilos em navegador real
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME" || { echo "Chrome indisponível para validar CSS"; exit 1; }
          mkdir -p artefatos-ui
          for WIDTH in 360 430; do
            "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --window-size="${WIDTH},1400" --virtual-time-budget=1200 --dump-dom "file://$PWD/tests/fixtures/dados-locais-paridade.html" > "artefatos-ui/paridade-${WIDTH}.html"
            if ! grep -q 'data-qa-fail="0"' "artefatos-ui/paridade-${WIDTH}.html"; then
              grep -A40 'id="qa-status"' "artefatos-ui/paridade-${WIDTH}.html" || true
              exit 1
            fi
            "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --window-size="${WIDTH},1400" --virtual-time-budget=1200 --screenshot="$PWD/artefatos-ui/paridade-${WIDTH}.png" "file://$PWD/tests/fixtures/dados-locais-paridade.html"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pmobile-paridade-nativa
          path: artefatos-ui/
          if-no-files-found: ignore
