name: Validar Dados locais do PMobile
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'www/index.html'
      - 'pmobile-modulos.js'
      - 'www/pmobile-modulos.js'
      - 'tests/modulos-legados.test.cjs'
      - 'dados-locais.js'
      - 'dados-locais/**'
      - 'www/dados-locais/**'
      - 'www/dados-locais.js'
      - 'tests/dados-locais-importacao.test.cjs'
      - 'tests/dados-locais-visual.test.cjs'
      - 'tests/dados-locais.test.cjs'
      - 'tests/permissoes-nivel2.test.cjs'
      - 'tests/credenciais-admin.test.cjs'
      - 'tests/unificacao.test.cjs'
      - 'tests/ota.test.cjs'
      - 'tests/build-ota.cjs'
      - 'tests/build-unificacao.cjs'
      - 'locais.js'
      - 'script.js'
      - 'valorestotal.js'
      - 'implementacoes/**'
      - 'tests/build-bughunter-conferencias.cjs'
      - 'tests/fixtures/dados-locais-paridade.html'
      - '.github/workflows/test-dados-locais.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'www/index.html'
      - 'pmobile-modulos.js'
      - 'www/pmobile-modulos.js'
      - 'tests/modulos-legados.test.cjs'
      - 'dados-locais.js'
      - 'reorganizacao-pmobile.js'
      - 'dados-locais/**'
      - 'index.html'
      - 'script.js'
      - 'implementacoes/dados-locais.css'
      - 'www/**'
      - 'sql/pmobile_dados_locais_isolados.sql'
      - 'tests/dados-locais.test.cjs'
      - 'tests/dados-locais-visual.test.cjs'
      - 'tests/dados-locais.test.cjs'
      - 'tests/permissoes-nivel2.test.cjs'
      - 'tests/credenciais-admin.test.cjs'
      - 'tests/unificacao.test.cjs'
      - 'tests/ota.test.cjs'
      - 'tests/build-ota.cjs'
      - 'tests/build-unificacao.cjs'
      - 'tests/build-bughunter-conferencias.cjs'
      - 'tests/fixtures/dados-locais-paridade.html'
      - '.github/workflows/test-dados-locais.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Conferir sintaxe e isolamento das fontes
        run: |
          node --check pmobile-modulos.js
          node --check dados-locais.js
          for f in dados-locais/*.js; do node --check "$f"; done
          node --check reorganizacao-pmobile.js
          node --check script.js
          node --test tests/*.test.cjs
      - name: Verificar navegação e análise financeira unificadas
        run: |
          node tests/build-unificacao.cjs
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          mkdir -p artefatos-ui
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --window-size=390,1300 --virtual-time-budget=1500 --dump-dom "file://$PWD/tests/fixtures/unificacao.html" > artefatos-ui/unificacao.html
          grep -q 'data-qa-fail="0"' artefatos-ui/unificacao.html
      - name: Conferir paridade de estilos em navegador real
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME" || { echo "Chrome indisponível para validar CSS"; exit 1; }
          mkdir -p artefatos-ui
          for WIDTH in 360 430; do
            "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --window-size="${WIDTH},1400" --virtual-time-budget=1200 --dump-dom "file://$PWD/tests/fixtures/dados-locais-paridade.html" > "artefatos-ui/paridade-${WIDTH}.html"
            if ! grep -q 'data-qa-fail="0"' "artefatos-ui/paridade-${WIDTH}.html"; then
              grep -A40 'id="qa-status"' "artefatos-ui/paridade-${WIDTH}.html" || true
              exit 1
            fi
            "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --window-size="${WIDTH},1400" --virtual-time-budget=1200 --screenshot="$PWD/artefatos-ui/paridade-${WIDTH}.png" "file://$PWD/tests/fixtures/dados-locais-paridade.html"
          done
      - name: Comparar o HTML real de Contagem manual e Conferências locais
        run: |
          node tests/build-bughunter-conferencias.cjs
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          for WIDTH in 390 430; do
            "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --window-size="${WIDTH},1300" --virtual-time-budget=1200 --dump-dom "file://$PWD/tests/fixtures/bughunter-conferencias.html" > "artefatos-ui/bughunter-${WIDTH}.html"
            if ! grep -q 'data-qa-fail="0"' "artefatos-ui/bughunter-${WIDTH}.html"; then
              grep -A55 'id="qa-status"' "artefatos-ui/bughunter-${WIDTH}.html" || true
              exit 1
            fi
            "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --window-size="${WIDTH},1300" --virtual-time-budget=1200 --screenshot="$PWD/artefatos-ui/bughunter-${WIDTH}.png" "file://$PWD/tests/fixtures/bughunter-conferencias.html"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pmobile-paridade-nativa
          path: artefatos-ui/
          if-no-files-found: ignore
